<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webinar Audience & Performance Report</title>
<style>
  :root {
    --navy:#0f172a;
    --navy-2:#1e293b;
    --cyan:#0891b2;
    --cyan-soft:#ecfeff;
    --green:#059669;
    --green-soft:#ecfdf5;
    --amber:#d97706;
    --amber-soft:#fffbeb;
    --red:#dc2626;
    --slate:#64748b;
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e2e8f0;
    --text:#334155;
    --muted:#64748b;
  }

  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  .container { max-width:1280px; margin:0 auto; padding:28px; }
  header {
    background:linear-gradient(135deg,var(--navy),var(--navy-2));
    color:#fff;
    border-radius:16px;
    padding:28px;
    margin-bottom:24px;
    box-shadow:0 12px 30px rgba(15,23,42,.16);
  }
  .header-top {
    display:flex;
    justify-content:space-between;
    gap:24px;
    align-items:flex-start;
  }
  .title-area h1 { margin:0 0 6px; font-size:30px; line-height:1.2; }
  .title-area .subtitle { margin:0 0 12px; color:#cbd5e1; }
  .title-area .meta { margin:0; color:#e2e8f0; font-size:14px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  select,button {
    min-height:42px;
    padding:9px 13px;
    border-radius:9px;
    font-size:14px;
    font-weight:600;
  }
  select { min-width:300px; max-width:460px; background:#fff; color:var(--navy); border:1px solid #cbd5e1; }
  button { border:1px solid rgba(255,255,255,.35); background:var(--cyan); color:#fff; cursor:pointer; }
  button:hover { background:#0e7490; }
  .nav-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
  .nav-tabs a {
    color:#e2e8f0;
    text-decoration:none;
    padding:7px 10px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:8px;
    font-size:13px;
  }
  .nav-tabs a:hover { background:rgba(255,255,255,.1); }
  .view-banner {
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:18px;
    margin:4px 0 18px;
  }
  .view-banner h2 { margin:0 0 4px; color:var(--navy); font-size:23px; }
  .view-banner p { margin:0; color:var(--muted); }
  .validation-badge {
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:999px;
    background:var(--green-soft);
    color:#047857;
    font-weight:700;
    font-size:13px;
    white-space:nowrap;
  }
  .kpi-grid {
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
    margin-bottom:24px;
  }
  .kpi-card,.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:13px;
    box-shadow:0 3px 12px rgba(15,23,42,.045);
  }
  .kpi-card { padding:18px; }
  .kpi-label {
    color:var(--muted);
    font-size:12px;
    font-weight:750;
    letter-spacing:.055em;
    text-transform:uppercase;
  }
  .kpi-value { color:var(--navy); font-size:30px; font-weight:800; margin:4px 0 2px; }
  .kpi-sub { color:var(--cyan); font-size:13px; font-weight:650; }
  .section { scroll-margin-top:16px; margin-top:28px; }
  .section-title {
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--navy);
    font-size:20px;
    margin:0 0 13px;
  }
  .section-title::before {
    content:"";
    width:5px;
    height:21px;
    border-radius:4px;
    background:var(--cyan);
  }
  .grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
  .card { padding:19px; overflow-x:auto; }
  .card h3 { margin:0 0 14px; color:var(--navy); font-size:16px; }
  .bar-row { margin:0 0 14px; }
  .bar-label { display:flex; justify-content:space-between; gap:12px; font-size:13px; font-weight:650; }
  .bar-track { height:24px; margin-top:6px; background:#e2e8f0; border-radius:7px; overflow:hidden; }
  .bar-fill {
    min-width:0;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:8px;
    color:#fff;
    font-size:11px;
    font-weight:750;
    border-radius:7px;
  }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:10px 9px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--navy); background:#f1f5f9; font-weight:750; white-space:nowrap; }
  tbody tr:hover td { background:#f8fafc; }
  .number { text-align:right; white-space:nowrap; }
  .badge {
    display:inline-block;
    margin-left:6px;
    padding:2px 6px;
    border-radius:999px;
    background:var(--amber-soft);
    color:#92400e;
    font-size:10px;
    font-weight:750;
    white-space:nowrap;
  }
  .insight {
    border-left:4px solid var(--cyan);
    padding:13px 14px;
    margin-bottom:10px;
    border-radius:0 9px 9px 0;
    background:var(--cyan-soft);
  }
  .insight.fact { border-left-color:var(--green); background:var(--green-soft); }
  .insight.observation { border-left-color:var(--cyan); background:var(--cyan-soft); }
  .insight-type { color:var(--navy); font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; margin-bottom:3px; }
  .empty-state { color:var(--muted); text-align:center; padding:24px 12px; background:#f8fafc; border-radius:9px; }
  .note { margin-top:12px; color:var(--muted); font-size:12px; }
  .methodology { color:var(--muted); font-size:13px; }
  .methodology ul { margin:9px 0 0 18px; padding:0; }
  .methodology li { margin-bottom:6px; }
  footer { margin:28px 0 4px; text-align:center; color:var(--muted); font-size:12px; }

  @media(max-width:900px) {
    .header-top,.view-banner { align-items:stretch; flex-direction:column; }
    .controls { justify-content:flex-start; }
    select { min-width:0; width:100%; max-width:none; }
    .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .grid-2 { grid-template-columns:1fr; }
  }
  @media(max-width:560px) {
    .container { padding:14px; }
    header { padding:20px; }
    .title-area h1 { font-size:24px; }
    .kpi-grid { grid-template-columns:1fr; }
  }
  @media print {
    body { background:#fff; font-size:11px; }
    .container { max-width:none; padding:0; }
    header { background:#fff; color:var(--navy); box-shadow:none; border:1px solid var(--border); }
    .title-area .subtitle,.title-area .meta { color:var(--muted); }
    .controls,.nav-tabs { display:none; }
    .kpi-card,.card { box-shadow:none; break-inside:avoid; }
    .section { break-inside:auto; }
    .section-title { break-after:avoid; }
  }
</style>
</head>

const escapeHtml = value => String(value ?? '')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

const safeNumber = value => Number.isFinite(Number(value)) ? Number(value) : 0;
const safeDiv = (a,b) => safeNumber(b) > 0 ? safeNumber(a) / safeNumber(b) : 0;
const formatNum = value => new Intl.NumberFormat('en-US').format(safeNumber(value));
const formatPct = value => (safeNumber(value) * 100).toFixed(1) + '%';
const formatMinutes = value => safeNumber(value).toFixed(1) + ' min';
const formatDate = value => {
  if (!value) return 'Date unavailable';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return new Intl.DateTimeFormat('en-US',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}).format(date);
};
const shortTitle = webinar => {
  const date = formatDate(webinar.webinar_date);
  const title = String(webinar.webinar_name || webinar.event_key || 'Webinar');
  return date + ' — ' + (title.length > 54 ? title.slice(0,51) + '…' : title);
};
const safeClass = value => String(value || '').toLowerCase().replace(/[^a-z0-9_-]/g,'');

function kpi(label,value,sub='') {
  return '<article class="kpi-card"><div class="kpi-label">' + escapeHtml(label) + '</div><div class="kpi-value">' + escapeHtml(value) + '</div>' + (sub ? '<div class="kpi-sub">' + escapeHtml(sub) + '</div>' : '') + '</article>';
}

function bar(label,count,total,color) {
  const pct = Math.min(100,Math.max(0,safeDiv(count,total) * 100));
  return '<div class="bar-row"><div class="bar-label"><span>' + escapeHtml(label) + ' (' + formatNum(count) + ')</span><span>' + pct.toFixed(1) + '%</span></div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '">' + (pct >= 9 ? pct.toFixed(1) + '%' : '') + '</div></div></div>';
}

function insightList(items) {
  if (!items || items.length === 0) return '<div class="empty-state">No additional observations for this view.</div>';
  return items.map(item => '<div class="insight ' + safeClass(item.type) + '"><div class="insight-type">' + escapeHtml(String(item.type || 'observation').replaceAll('_',' ')) + '</div><div>' + escapeHtml(item.text) + '</div></div>').join('');
}

function emailTypeRows(emailTypes) {
  return ['personal','corporate','unknown'].map(type => {
    const item = emailTypes?.[type] || {};
    return '<tr><td style="text-transform:capitalize">' + escapeHtml(type) + '</td><td class="number">' + formatNum(item.total) + '</td><td class="number">' + formatPct(safeDiv(item.joined,item.total)) + '</td><td class="number">' + formatPct(safeDiv(item.attended,item.total)) + '</td></tr>';
  }).join('');
}

function sourceRows(sources) {
  if (!sources || sources.length === 0) return '<tr><td colspan="7"><div class="empty-state">No declared source data available.</div></td></tr>';
  return sources.map(source => '<tr><td>' + escapeHtml(source.name) + (source.small_sample ? '<span class="badge">Small sample</span>' : '') + '</td><td class="number">' + formatNum(source.total) + '</td><td class="number">' + formatPct(source.share_of_registrants) + '</td><td class="number">' + formatNum(source.joined) + '</td><td class="number">' + formatNum(source.attended) + '</td><td class="number">' + formatPct(source.join_rate) + '</td><td class="number">' + formatPct(source.attendance_rate) + '</td></tr>').join('');
}

function domainRows(domains) {
  if (!domains || domains.length === 0) return '<tr><td colspan="5"><div class="empty-state">No external corporate domain appeared more than once in this webinar.</div></td></tr>';
  return domains.map(domain => '<tr><td>' + escapeHtml(domain.name) + '</td><td class="number">' + formatNum(domain.total) + '</td><td class="number">' + formatNum(domain.joined) + '</td><td class="number">' + formatNum(domain.attended) + '</td><td class="number">' + formatPct(domain.attendance_rate) + '</td></tr>').join('');
}

function comparisonRows(webinars) {
  return webinars.map(webinar => '<tr><td>' + escapeHtml(webinar.webinar_name) + '<div class="note">' + escapeHtml(formatDate(webinar.webinar_date)) + '</div></td><td class="number">' + formatNum(webinar.totals.total_registrants) + '</td><td class="number">' + formatNum(webinar.totals.joined_count) + '</td><td class="number">' + formatNum(webinar.totals.attended_count) + '</td><td class="number">' + formatPct(webinar.rates.join_rate) + '</td><td class="number"><strong>' + formatPct(webinar.rates.attendance_rate) + '</strong></td></tr>').join('');
}

function retentionComparisonRows(webinars) {
  return webinars.map(webinar => '<tr><td>' + escapeHtml(webinar.webinar_name) + '</td><td class="number">' + formatPct(webinar.retention.rates.retained_25) + '</td><td class="number">' + formatPct(webinar.retention.rates.retained_50) + '</td><td class="number">' + formatPct(webinar.retention.rates.retained_75) + '</td><td class="number"><strong>' + formatPct(webinar.retention.rates.stayed_until_end) + '</strong></td></tr>').join('');
}

function demographicRows(items) {
  return (items || []).map(item => '<tr><td>' + escapeHtml(item.name) + '</td><td class="number">' + formatNum(item.total) + '</td><td class="number">' + formatPct(item.share_of_registrants) + '</td><td class="number">' + formatNum(item.joined) + '</td><td class="number">' + formatNum(item.stayed_15_plus) + '</td><td class="number">' + formatPct(item.stayed_15_plus_rate) + '</td></tr>').join('');
}

function companyTypeRows(items) {
  if (!items || items.length === 0) return '<tr><td colspan="5"><div class="empty-state">No corporate company classifications are available yet.</div></td></tr>';
  return items.map(item => '<tr><td>' + escapeHtml(item.name) + '</td><td class="number">' + formatNum(item.total) + '</td><td class="number">' + formatNum(item.joined) + '</td><td class="number">' + formatNum(item.stayed_15_plus) + '</td><td class="number">' + formatPct(item.stayed_15_plus_rate) + '</td></tr>').join('');
}

function companyCoverageNote(analysis) {
  const total = safeNumber(analysis?.corporate_registrants);
  const classified = Math.max(0,safeNumber(analysis?.classified_registrants ?? (total - safeNumber((analysis?.types || []).find(item => item.key === 'Unknown')?.total))));
  const coverage = safeNumber(analysis?.classification_coverage ?? safeDiv(classified,total));
  const warning = total > 0 && coverage < 0.6
    ? ' Company-type comparisons are directional because classification coverage is limited.'
    : '';
  return '<p class="note"><strong>Classification coverage:</strong> ' + formatNum(classified) + ' of ' + formatNum(total) + ' corporate registrations (' + formatPct(coverage) + ').' + warning + '</p>';
}

function timelineChart(timeline) {
  if (!timeline?.available || !timeline.series?.length) return '<div class="empty-state">Audience timeline is unavailable for this webinar.</div>';
  const width = 900, height = 260, padX = 42, padY = 24;

  const maxActive = Math.max(1,...timeline.series.map(p => safeNumber(p.active)));
  const x = minute => padX + (safeNumber(minute) / maxMinute) * (width - padX * 2);
  const y = active => height - padY - (safeNumber(active) / maxActive) * (height - padY * 2);
  const points = timeline.series.map(p => x(p.minute).toFixed(1) + ',' + y(p.active).toFixed(1)).join(' ');
  const drop = timeline.largest_sustained_drop;
  const marker = drop ? '<circle cx="' + x(drop.start_minute).toFixed(1) + '" cy="' + y(drop.audience_before).toFixed(1) + '" r="6" fill="#dc2626"><title>Start of largest 3-minute net audience decline</title></circle>' : '';
  const guides = [0,0.25,0.5,0.75,1].map(ratio => '<line x1="' + padX + '" x2="' + (width-padX) + '" y1="' + y(maxActive*ratio).toFixed(1) + '" y2="' + y(maxActive*ratio).toFixed(1) + '" stroke="#e2e8f0" stroke-width="1"/><text x="4" y="' + (y(maxActive*ratio)+4).toFixed(1) + '" font-size="11" fill="#64748b">' + Math.round(maxActive*ratio) + '</text>').join('');
  return '<div style="overflow-x:auto"><svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Active audience by webinar minute" style="width:100%;min-width:640px">' + guides + '<polyline points="' + points + '" fill="none" stroke="#0284c7" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>' + marker + '<text x="' + padX + '" y="255" font-size="11" fill="#64748b">0 min</text><text x="' + (width-padX-42) + '" y="255" font-size="11" fill="#64748b">' + maxMinute + ' min</text></svg></div>';
}

function dropoffComparisonRows(items) {
  return (items || []).map(item => {
    const drop = item.largest_sustained_drop;
    return '<tr><td>' + escapeHtml(item.webinar_name) + '</td><td class="number">' + formatNum(item.peak_audience) + '</td><td class="number">' + (drop ? formatNum(drop.people_lost) : '—') + '</td><td class="number">' + (drop ? formatNum(drop.start_minute) + ' min' : '—') + '</td><td>' + (drop ? escapeHtml(String(drop.session_phase || 'unknown').replace(/^./, char => char.toUpperCase())) : '—') + '</td><td class="number">' + (drop ? escapeHtml(drop.recording_timestamp) : '—') + '</td></tr>';
  }).join('');
}

function aiAnalysisHtml(analysis, isAll, selectedEventKey) {
  if (!analysis) return '<div class="empty-state">AI analysis is not available.</div>';
  const visibleFindings = (analysis.key_findings || []).filter(item => isAll || item.event_key === selectedEventKey);
  const visibleRecommendations = (analysis.recommendations || []).filter(item => isAll || item.event_key === selectedEventKey);
  const findings = visibleFindings.map(item => '<div class="insight"><strong>' + escapeHtml(item.text) + '</strong><details><summary>View supporting data</summary><div class="note" style="margin-top:8px">' + escapeHtml(item.evidence) + '</div></details></div>').join('') || '<div class="empty-state">No webinar-specific AI finding was returned for this event.</div>';
  const recommendations = visibleRecommendations.map(item => '<li><strong>' + escapeHtml(item.priority.toUpperCase()) + ':</strong> ' + escapeHtml(item.action) + '<details><summary>Why this action</summary><div class="note" style="margin-top:8px">' + escapeHtml(item.rationale) + '</div></details></li>').join('') || '<li>No webinar-specific recommendation was returned for this event.</li>';
  const limitations = (analysis.limitations || []).map(item => '<li>' + escapeHtml(item) + '</li>').join('');
  const disclaimer = '<div class="card" style="border-left:4px solid #0891b2;background:#ecfeff"><strong>AI-assisted interpretation</strong><p style="margin:8px 0 0">This section summarizes patterns in aggregate attendance data. It does not change calculated metrics, identify causation, or confirm gender identity or marketing attribution.</p></div>';
  const summary = isAll ? '<div class="card" style="margin-top:16px"><h3>Executive summary · all selected webinars</h3><p>' + escapeHtml(analysis.executive_summary) + '</p></div>' : '';
  const limits = isAll ? '<div class="card" style="margin-top:16px"><h3>Important limitations</h3><ul>' + limitations + '</ul></div>' : '';
  return disclaimer + summary + '<div class="grid-2" style="margin-top:16px"><div class="card"><h3>' + (isAll ? 'AI findings' : 'Findings for this webinar') + '</h3>' + findings + '</div><div class="card"><h3>' + (isAll ? 'Recommended actions' : 'Actions for this webinar') + '</h3><ol>' + recommendations + '</ol></div></div>' + limits;
}

function render() {
  const select = document.getElementById('webinar-select');
  const selected = select.value || 'all';
  const isAll = selected === 'all';
  const data = isAll ? payload.overall_metrics : payload.webinar_metrics.find(item => item.event_key === selected);
  if (!data) throw new Error('Selected webinar data was not found.');

  const totals = data.totals;
  const rates = data.rates;
  const retention = data.retention;
  const retention75Rate = retention.rates?.retained_75 ?? safeDiv(retention.retained_75_count,totals.joined_count);
  const stayedUntilEndRate = retention.rates?.stayed_until_end ?? safeDiv(retention.stayed_until_end_count,totals.joined_count);
  const insights = isAll ? payload.comparison_insights : data.deterministic_insights;

  const heading = isAll ? 'All Webinars — Executive Overview' : data.webinar_name;
  const detail = isAll
    ? payload.webinar_metrics.length + ' webinars · ' + formatDate(payload.webinar_metrics[0]?.webinar_date) + ' to ' + formatDate(payload.webinar_metrics[payload.webinar_metrics.length - 1]?.webinar_date)
    : formatDate(data.webinar_date) + ' · ' + formatMinutes(data.engagement_duration_minutes) + ' engagement window' + (data.webinar_timezone ? ' · ' + data.webinar_timezone : '');

  let out = '<section class="view-banner"><div><h2>' + escapeHtml(heading) + '</h2><p>' + escapeHtml(detail) + '</p></div><div class="validation-badge">✓ Validated dataset</div></section>';

  out += '<section id="overview" class="section"><div class="kpi-grid">';
  out += kpi('Registrants',formatNum(totals.total_registrants),isAll ? payload.webinar_metrics.length + ' webinars' : 'Registered audience');
  out += kpi('Joined',formatNum(totals.joined_count),formatPct(rates.join_rate) + ' join rate');
  out += kpi('Stayed 15+ Minutes',formatNum(totals.attended_count),formatPct(rates.attendance_rate) + ' of registrants');
  out += kpi('Did Not Reach 15 Minutes',formatNum(totals.operational_no_show_count),formatPct(safeDiv(totals.operational_no_show_count,totals.total_registrants)) + ' of registrants');
  out += kpi('75% retention',formatNum(retention.retained_75_count),formatPct(retention75Rate) + ' of joined');
  out += kpi('Stayed Until the End',formatNum(retention.stayed_until_end_count),formatPct(stayedUntilEndRate) + ' of joined');

  out += '</div><div class="grid-2"><div class="card"><h3>Key findings</h3>' + insightList(insights) + '</div><div class="card"><h3>Interpretation boundary</h3><p>Attendance data shows <strong>what changed</strong> between webinars. Campaign timing, landing-page copy, email and SMS delivery data are required before attributing those differences to a specific cause.</p><p class="note">All displayed metrics are calculated deterministically. AI-assisted interpretation is clearly labeled in its own section and does not change those metrics.</p></div></div></section>';

  out += '<section id="attendance" class="section"><h2 class="section-title">Attendance</h2><div class="grid-2"><div class="card"><h3>Attendance funnel</h3>';
  out += bar('Registrants',totals.total_registrants,totals.total_registrants,'#0f172a');
  out += bar('Joined',totals.joined_count,totals.total_registrants,'#0891b2');
  out += bar('Stayed 15+ Minutes',totals.attended_count,totals.total_registrants,'#059669');
  out += '<p class="note">Joined Live includes everyone who entered. Stayed 15+ Minutes includes only people who remained for at least ' + formatNum(payload.methodology.minimum_attendance_minutes) + ' minutes.</p>';
  out += '</div><div class="card"><h3>Early exits & no-shows</h3>';
  out += bar('Left Before 15 Minutes',totals.joined_under_threshold_count,totals.total_registrants,'#d97706');
  out += bar('Never Joined',totals.never_joined_count,totals.total_registrants,'#64748b');
  out += '<p class="note">Did Not Reach 15 Minutes = Left Before 15 Minutes + Never Joined. These categories are mutually exclusive.</p></div></div>';

  if (isAll) {
    out += '<div class="card" style="margin-top:16px"><h3>Webinar comparison</h3><table><thead><tr><th>Webinar</th><th class="number">Registrants</th><th class="number">Joined</th><th class="number">Stayed 15+ min</th><th class="number">Join rate</th><th class="number">15+ min rate</th></tr></thead><tbody>' + comparisonRows(payload.webinar_metrics) + '</tbody></table></div>';
  }
  out += '</section>';

  out += '<section id="engagement" class="section"><h2 class="section-title">Engagement & Retention</h2><div class="card"><h3>Retention milestones · among joined</h3>';
  out += bar('Watched at least 25%',retention.retained_25_count,totals.joined_count,'#0ea5e9');
  out += bar('Watched at least 50%',retention.retained_50_count,totals.joined_count,'#0284c7');
  out += bar('Watched at least 75%',retention.retained_75_count,totals.joined_count,'#0369a1');
  out += bar('Stayed Until the End',retention.stayed_until_end_count,totals.joined_count,'#059669');
  out += '<p class="note">Stayed Until the End means the participant was still present during the final ' + formatNum(payload.methodology.stayed_until_end_window_minutes) + ' minutes of the official engagement window.</p></div>';

  if (isAll) {
    out += '<div class="card" style="margin-top:16px"><h3>Retention comparison</h3><table><thead><tr><th>Webinar</th><th class="number">25%</th><th class="number">50%</th><th class="number">75%</th><th class="number">Stayed until end</th></tr></thead><tbody>' + retentionComparisonRows(payload.webinar_metrics) + '</tbody></table></div>';
  }
  out += '</section>';

  out += '<section id="audience" class="section"><h2 class="section-title">Audience</h2><div class="grid-2"><div class="card"><h3>Email profile</h3><table><thead><tr><th>Type</th><th class="number">Registrants</th><th class="number">Join rate</th><th class="number">15+ min rate</th></tr></thead><tbody>' + emailTypeRows(data.email_types) + '</tbody></table></div><div class="card"><h3>Top external corporate domains</h3><table><thead><tr><th>Domain</th><th class="number">Registrants</th><th class="number">Joined</th><th class="number">Stayed 15+ min</th><th class="number">15+ min rate</th></tr></thead><tbody>' + domainRows(data.domains_array) + '</tbody></table><p class="note">Shows organizations with two or more registrations using the same corporate email domain. Personal email providers, client-owned domains and domains appearing only once are excluded.</p></div></div><div class="grid-2" style="margin-top:16px"><div class="card"><h3>Estimated gender profile</h3><table><thead><tr><th>Estimated gender</th><th class="number">Registrants</th><th class="number">Share</th><th class="number">Joined</th><th class="number">Stayed 15+ min</th><th class="number">15+ min rate</th></tr></thead><tbody>' + demographicRows(data.gender_analysis?.types) + '</tbody></table><p class="note">Estimated from first names for aggregate audience analysis. It may not reflect each participant’s gender identity. Ambiguous names remain Unknown.</p></div><div class="card"><h3>Company types</h3><table><thead><tr><th>Company type</th><th class="number">Registrants</th><th class="number">Joined</th><th class="number">Stayed 15+ min</th><th class="number">15+ min rate</th></tr></thead><tbody>' + companyTypeRows(data.company_analysis?.types) + '</tbody></table><p class="note">Classification is based on corporate email domains and available organization data. Unknown means evidence or confidence was insufficient.</p>' + companyCoverageNote(data.company_analysis) + '</div></div></section>';

  out += '<section id="dropoff" class="section"><h2 class="section-title">Audience Timeline</h2>';
  if (isAll) {
    out += '<div class="card"><h3>Largest 3-minute net audience decline by webinar</h3><table><thead><tr><th>Webinar</th><th class="number">Peak audience</th><th class="number">Net decline</th><th class="number">Approx. minute</th><th>Session phase</th><th class="number">Elapsed webinar time</th></tr></thead><tbody>' + dropoffComparisonRows(data.audience_timeline?.comparison) + '</tbody></table><p class="note">Session phase is calculated deterministically from the decline’s position within the engagement window: early, middle, or late. Elapsed time is measured from the official engagement start and may not exactly match the recording player. Select an individual webinar to view the curve and exit details. The first and final five minutes are excluded.</p></div>';
  } else {
    const timeline = data.audience_timeline || {};
    const drop = timeline.largest_sustained_drop;
    out += '<div class="card"><h3>Active audience by minute</h3>' + timelineChart(timeline) + '</div>';
    if (timeline.available && drop) {
      out += '<div class="grid-2" style="margin-top:16px"><div class="card"><h3>Largest 3-minute net decline</h3><div class="kpi-value">' + formatNum(drop.people_lost) + ' people</div><p>Active audience decreased from <strong>' + formatNum(drop.audience_before) + '</strong> to <strong>' + formatNum(drop.audience_after) + '</strong> between approximately minute ' + formatNum(drop.start_minute) + ' and minute ' + formatNum(drop.end_minute) + ' (' + formatPct(drop.percent_of_peak) + ' of peak audience).</p><p>This window falls in the <strong>' + escapeHtml(drop.session_phase || 'unknown') + '</strong> portion of the webinar.</p><p class="note">Within this window, ' + formatNum(drop.unique_exits_in_window) + ' unique participants recorded an exit and ' + formatNum(drop.unique_entries_in_window) + ' entered or re-entered. This is a net audience change, not proof of simultaneous disconnections.</p></div><div class="card"><h3>Approx. webinar review point</h3><div class="kpi-value">' + escapeHtml(drop.recording_timestamp) + '</div><p>Review the session around this elapsed time to see what was happening. It is measured from the official engagement start and may not exactly match the recording player. Attendance data identifies when the decline occurred, not why.</p></div></div>';
    }
  }
  out += '</section>';

  out += '<section id="sources" class="section"><h2 class="section-title">How Did You Hear About Us?</h2><div class="card"><table><thead><tr><th>Source</th><th class="number">Registrants</th><th class="number">Share</th><th class="number">Joined</th><th class="number">Stayed 15+ min</th><th class="number">Join rate</th><th class="number">15+ min rate</th></tr></thead><tbody>' + sourceRows(data.sources_array) + '</tbody></table><p class="note">Based on the answer provided by registrants during webinar registration. This is self-reported and does not represent verified marketing attribution. Small sample indicates fewer than ' + formatNum(payload.methodology.source_minimum_sample_size) + ' registrations.</p></div></section>';


  out += '<section id="ai-analysis" class="section"><h2 class="section-title">AI Analysis</h2>' + aiAnalysisHtml(payload.ai_analysis, isAll, selected) + '</section>';

  out += '<section id="methodology" class="section"><h2 class="section-title">Methodology</h2><div class="card methodology"><ul><li><strong>Registrant:</strong> one persisted attendance record in the selected validated run.</li><li><strong>Joined:</strong> the registrant has positive Zoom duration or a matched participant record.</li><li><strong>Stayed 15+ Minutes:</strong> joined and remained for at least ' + formatNum(payload.methodology.minimum_attendance_minutes) + ' minutes.</li><li><strong>Left Before 15 Minutes:</strong> joined but remained for less than ' + formatNum(payload.methodology.minimum_attendance_minutes) + ' minutes.</li><li><strong>Never Joined:</strong> registered but did not enter the webinar.</li><li><strong>Retention:</strong> calculated against the official engagement window, excluding pre-event practice time.</li><li><strong>Stayed Until the End:</strong> the participant was still present during the final ' + formatNum(payload.methodology.stayed_until_end_window_minutes) + ' minutes of that window.</li><li><strong>Source performance:</strong> based on self-declared registration answers. Small samples are flagged.</li><li><strong>Email profile:</strong> domain-based personal/corporate classification. No individual email or phone number appears in this report.</li><li><strong>Audience timeline:</strong> calculated from merged participant sessions. The largest net audience decline compares active audience across a ' + formatNum(payload.webinar_metrics[0]?.audience_timeline?.calculation?.window_minutes || 3) + '-minute window and excludes the natural opening and closing periods. Session phase divides the engagement window into equal early, middle and late thirds.</li><li><strong>Estimated gender:</strong> first-name association used only for aggregate analysis; Unknown is retained when confidence is insufficient.</li><li><strong>Company type:</strong> inferred from corporate domains and available organization evidence, with cached results.</li><li><strong>AI analysis:</strong> interprets aggregate metrics but never changes calculations or establishes causation.</li><li><strong>Limitation:</strong> Zoom attendance alone cannot establish why performance changed.</li></ul></div></section>';

  document.getElementById('dashboard').innerHTML = out;
}

function init() {
  document.getElementById('report-title').innerText = payload.report_metadata.title;
  document.getElementById('report-subtitle').innerText = payload.report_metadata.subtitle || '';
  document.getElementById('report-meta').innerText = 'Client: ' + payload.report_metadata.client_key + ' · Generated: ' + new Date(payload.report_metadata.generated_at).toLocaleString('en-US') + ' · Version: ' + payload.report_metadata.report_version;
  document.getElementById('report-footer').innerText = 'Generated from the latest completed and validated attendance runs.';

  const select = document.getElementById('webinar-select');
  const allOption = document.createElement('option');
  allOption.value = 'all';
  allOption.innerText = 'All Webinars (' + payload.webinar_metrics.length + ')';
  select.appendChild(allOption);

  payload.webinar_metrics.forEach(webinar => {
    const option = document.createElement('option');
    option.value = webinar.event_key;
    option.innerText = shortTitle(webinar);
    select.appendChild(option);
  });

  select.addEventListener('change',render);
  render();
}

window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
